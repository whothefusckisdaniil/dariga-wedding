<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дариға — Админ панель</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Forum&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cormorant Garamond',serif;background:#f0ebe6;color:#3d4d61;min-height:100vh;}

/* ── LOGIN SCREEN ── */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#f7e8f0,#e8f0f7);
}
.login-box{
  background:white;border-radius:24px;padding:50px 40px;
  box-shadow:0 20px 60px rgba(0,0,0,.1);text-align:center;width:340px;
}
.login-box h1{font-family:'Forum',serif;font-size:36px;color:#87A5CC;margin-bottom:8px;}
.login-box p{font-size:18px;color:#888;margin-bottom:30px;}
.login-box input{
  width:100%;padding:14px 18px;border:1.5px solid #ddd;border-radius:12px;
  font-size:20px;font-family:inherit;text-align:center;letter-spacing:4px;
  outline:none;margin-bottom:16px;
}
.login-box input:focus{border-color:#87A5CC;}
.login-box button{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:#87A5CC;color:white;font-size:20px;font-family:inherit;cursor:pointer;
}
.login-box button:hover{background:#6d8fb8;}
.login-error{color:#c0392b;font-size:16px;margin-top:12px;display:none;}

/* ── ADMIN PANEL ── */
#adminPanel{display:none;}

.topbar{
  background:white;padding:18px 30px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.topbar h1{font-family:'Forum',serif;font-size:32px;color:#87A5CC;}
.topbar-right{display:flex;gap:12px;align-items:center;}
.refresh-btn{
  padding:10px 20px;border:1.5px solid #87A5CC;border-radius:10px;
  background:white;color:#87A5CC;font-size:16px;font-family:inherit;cursor:pointer;
}
.refresh-btn:hover{background:#f0f5fb;}
.logout-btn{
  padding:10px 20px;border:none;border-radius:10px;
  background:#f5e6ea;color:#c0392b;font-size:16px;font-family:inherit;cursor:pointer;
}

.content{padding:30px;}

/* ── STAT CARDS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:30px;}
.stat-card{
  background:white;border-radius:16px;padding:22px 24px;
  box-shadow:0 4px 16px rgba(0,0,0,.05);
}
.stat-card .label{font-size:15px;color:#999;margin-bottom:6px;}
.stat-card .value{font-size:42px;font-weight:bold;color:#3d4d61;}
.stat-card.coming .value{color:#2ecc71;}
.stat-card.notcoming .value{color:#e74c3c;}
.stat-card.total .value{color:#87A5CC;}

/* ── TABLE ── */
.table-wrap{
  background:white;border-radius:16px;
  box-shadow:0 4px 16px rgba(0,0,0,.05);overflow:hidden;
}
.table-header{
  padding:20px 24px;border-bottom:1px solid #f0ebe6;
  display:flex;align-items:center;justify-content:space-between;
}
.table-header h2{font-family:'Forum',serif;font-size:26px;color:#87A5CC;}
.export-btn{
  padding:10px 20px;border:none;border-radius:10px;
  background:#e8f5e9;color:#27ae60;font-size:16px;font-family:inherit;cursor:pointer;
}
.export-btn:hover{background:#d5f0d7;}

table{width:100%;border-collapse:collapse;}
thead tr{background:#f8f5f2;}
th{padding:14px 18px;text-align:left;font-size:17px;color:#999;font-weight:500;border-bottom:1px solid #f0ebe6;}
td{padding:14px 18px;font-size:19px;border-bottom:1px solid #faf7f5;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fdf9f7;}

.badge{
  display:inline-block;padding:4px 12px;border-radius:20px;font-size:15px;
}
.badge.yes{background:#e8f8f0;color:#27ae60;}
.badge.no{background:#fdecea;color:#e74c3c;}

.empty{text-align:center;padding:60px;color:#bbb;font-size:22px;}

#loading{text-align:center;padding:60px;font-size:22px;color:#87A5CC;}

@media(max-width:600px){
  .topbar{flex-direction:column;gap:12px;text-align:center;}
  .content{padding:16px;}
  th,td{padding:10px 12px;font-size:16px;}
  .stat-card .value{font-size:32px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Дариға</h1>
    <p>Админ панелі</p>
    <input type="password" id="passwordInput" placeholder="••••••" onkeydown="if(event.key==='Enter')checkPassword()">
    <button onclick="checkPassword()">Кіру</button>
    <div class="login-error" id="loginError">Қате пароль</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <div class="topbar">
    <h1>🌸 Қыз ұзату — Қонақтар тізімі</h1>
    <div class="topbar-right">
      <button class="refresh-btn" onclick="loadData()">↻ Жаңарту</button>
      <button class="export-btn" onclick="exportCSV()">⬇ CSV</button>
      <button class="logout-btn" onclick="logout()">Шығу</button>
    </div>
  </div>

  <div class="content">

    <div class="stats">
      <div class="stat-card total">
        <div class="label">Барлық жауап</div>
        <div class="value" id="statTotal">—</div>
      </div>
      <div class="stat-card coming">
        <div class="label">Келеді ✓</div>
        <div class="value" id="statYes">—</div>
      </div>
      <div class="stat-card notcoming">
        <div class="label">Келмейді ✗</div>
        <div class="value" id="statNo">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Адам саны</div>
        <div class="value" id="statGuests">—</div>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <h2>Жауаптар</h2>
      </div>
      <div id="loading">Жүктелуде...</div>
      <table id="guestTable" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>Аты-жөні</th>
            <th>Жауап</th>
            <th>Адам саны</th>
            <th>Уақыты</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none;">Әлі жауап жоқ</div>
    </div>

  </div>
</div>

<script>
const BIN_ID  = "6a266ebff5f4af5e29c9b57b";
const API_KEY = "$2a$10$vMI8CQg8wYmphn..Wdhrxu0mQZMQmuKyImYQiytbkiVy6mNMteoqK";
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
const ADMIN_PASSWORD = "dariga2026"; /* ← можешь поменять */

let allGuests = [];

function checkPassword(){
  const val = document.getElementById("passwordInput").value;
  if(val === ADMIN_PASSWORD){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadData();
  } else {
    document.getElementById("loginError").style.display = "block";
    document.getElementById("passwordInput").value = "";
    setTimeout(()=>document.getElementById("loginError").style.display="none", 2000);
  }
}

function logout(){
  document.getElementById("adminPanel").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("passwordInput").value = "";
}

async function loadData(){
  document.getElementById("loading").style.display = "block";
  document.getElementById("guestTable").style.display = "none";
  document.getElementById("emptyMsg").style.display = "none";

  try {
    const res = await fetch(BIN_URL, {
      headers: { "X-Master-Key": API_KEY }
    });
    const data = await res.json();
    allGuests = data.record.guests || [];
    renderTable(allGuests);
  } catch(e){
    document.getElementById("loading").textContent = "Қате орын алды. Қайталап көріңіз.";
  }
}

function renderTable(guests){
  document.getElementById("loading").style.display = "none";

  /* stats */
  const yesGuests = guests.filter(g => g.answer.includes("Иә"));
  const noGuests  = guests.filter(g => !g.answer.includes("Иә"));
  const totalPeople = yesGuests.reduce((s,g) => s + (parseInt(g.guests)||1), 0);

  document.getElementById("statTotal").textContent  = guests.length;
  document.getElementById("statYes").textContent    = yesGuests.length;
  document.getElementById("statNo").textContent     = noGuests.length;
  document.getElementById("statGuests").textContent = totalPeople;

  if(guests.length === 0){
    document.getElementById("emptyMsg").style.display = "block";
    return;
  }

  /* table */
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  /* newest first */
  [...guests].reverse().forEach((g, i) => {
    const isYes = g.answer.includes("Иә");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="color:#bbb;">${guests.length - i}</td>
      <td><b>${escHtml(g.name)}</b></td>
      <td><span class="badge ${isYes?'yes':'no'}">${isYes ? '✓ Келеді' : '✗ Келмейді'}</span></td>
      <td>${isYes ? (g.guests || 1) + ' адам' : '—'}</td>
      <td style="color:#aaa;font-size:16px;">${escHtml(g.time || '')}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("guestTable").style.display = "table";
}

function escHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function exportCSV(){
  if(!allGuests.length){ alert("Деректер жоқ"); return; }
  const rows = [["№","Аты-жөні","Жауап","Адам саны","Уақыты"]];
  allGuests.forEach((g,i)=>{
    rows.push([i+1, g.name, g.answer, g.answer.includes("Иә") ? (g.guests||1) : 0, g.time||""]);
  });
  const csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "dariga_guests.csv";
  a.click();
}

/* auto-refresh every 30 sec when panel is open */
setInterval(()=>{
  if(document.getElementById("adminPanel").style.display !== "none") loadData();
}, 30000);
</script>
</body>
</html>
